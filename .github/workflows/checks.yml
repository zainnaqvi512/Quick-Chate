name: Quick Chat checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build
      - run: npm run lint
  mysql-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:9
        env:
          MYSQL_ROOT_PASSWORD: disposable-root-only
          MYSQL_DATABASE: quick_chat_test
          MYSQL_USER: quick_chat_ci
          MYSQL_PASSWORD: disposable-test-only
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck integration suite
        run: npx tsc --project tsconfig.integration.json
      - name: Test disposable MySQL database
        run: npm run test:integration
        env:
          # Synthetic container-only credentials; never use repository/production secrets here.
          TEST_DATABASE_URL: mysql://quick_chat_ci:disposable-test-only@127.0.0.1:${{ job.services.mysql.ports[3306] }}/quick_chat_test
